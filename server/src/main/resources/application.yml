server:
  port: 8080

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/nexachat}
    username: ${DATABASE_USER:nexachat}
    password: ${DATABASE_PASSWORD:nexachat}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

management:
  endpoints:
    web:
      exposure:
        include: health

nexachat:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-at-least-64-chars-long-0123456789}
    access-ttl-seconds: 900
    refresh-ttl-days: 14
  security:
    # Exact browser origins allowed to call the API. Empty admits no
    # cross-origin caller (the native app sends no Origin header); set this in
    # any deployment that also serves a web client.
    cors-allowed-origins: ${NEXACHAT_CORS_ALLOWED_ORIGINS:}
    # E.164 numbers allowed to read operator telemetry (/api/v1/rag/stats).
    admin-phones: ${NEXACHAT_ADMIN_PHONES:}
    # JSON request bodies above this size are rejected with 413.
    max-json-body-bytes: ${NEXACHAT_MAX_JSON_BODY_BYTES:1048576}
    # How long the JWT filter caches a user's access-token cutoff. Never
    # larger than the access-token lifetime.
    validity-cache-ttl-seconds: ${NEXACHAT_VALIDITY_CACHE_TTL_SECONDS:60}
  rate-limit:
    messages:
      edit-delete-per-minute: 30
      search-per-minute: 60
    stomp:
      messages-per-window: 30
      window-seconds: 10
      typing-per-window: 60
      typing-window-seconds: 10
      acks-per-window: 120
      ack-window-seconds: 10
  calls:
    ring-timeout-ms: ${NEXACHAT_CALLS_RING_TIMEOUT_MS:45000}
    disconnect-grace-ms: ${NEXACHAT_CALLS_DISCONNECT_GRACE_MS:15000}
  storage:
    root: ${STORAGE_ROOT:./data/uploads}
  presence:
    disconnect-coalesce-ms: 5000
  summary:
    provider: ${NEXACHAT_SUMMARY_PROVIDER:auto}
    complexity:
      min-messages: ${NEXACHAT_SUMMARY_COMPLEXITY_MIN_MESSAGES:12}
      min-chars: ${NEXACHAT_SUMMARY_COMPLEXITY_MIN_CHARS:1500}
      min-participants: ${NEXACHAT_SUMMARY_COMPLEXITY_MIN_PARTICIPANTS:4}
    llm:
      enabled: ${NEXACHAT_SUMMARY_LLM_ENABLED:false}
      base-url: ${NEXACHAT_SUMMARY_LLM_BASE_URL:https://api.deepseek.com}
      model: ${NEXACHAT_SUMMARY_LLM_MODEL:deepseek-flash}
      api-key: ${NEXACHAT_SUMMARY_LLM_API_KEY:}
      timeout-ms: ${NEXACHAT_SUMMARY_LLM_TIMEOUT_MS:30000}
      max-input-chars: ${NEXACHAT_SUMMARY_LLM_MAX_INPUT_CHARS:24000}
      max-output-tokens: ${NEXACHAT_SUMMARY_LLM_MAX_OUTPUT_TOKENS:4000}
      # Dedicated Local Server Model Tier (Ollama / vLLM / local server model)
      local-enabled: ${NEXACHAT_SUMMARY_LOCAL_LLM_ENABLED:false}
      local-base-url: ${NEXACHAT_SUMMARY_LOCAL_LLM_BASE_URL:http://host.docker.internal:11434/v1}
      local-model: ${NEXACHAT_SUMMARY_LOCAL_LLM_MODEL:qwen2.5:3b}
      local-api-key: ${NEXACHAT_SUMMARY_LOCAL_LLM_API_KEY:local-ollama}
      local-timeout-ms: ${NEXACHAT_SUMMARY_LOCAL_LLM_TIMEOUT_MS:60000}
  rag:
    enabled: ${NEXACHAT_RAG_ENABLED:true}
    embedding:
      provider: ${NEXACHAT_RAG_EMBEDDING_PROVIDER:lexical}
      mode: ${NEXACHAT_RAG_EMBEDDING_MODE:openai-compatible}
      base-url: ${NEXACHAT_RAG_EMBEDDING_BASE_URL:}
      model: ${NEXACHAT_RAG_EMBEDDING_MODEL:gemini-embedding-001}
      api-key: ${NEXACHAT_RAG_EMBEDDING_API_KEY:${NEXACHAT_SUMMARY_LLM_API_KEY:}}
      dim: ${NEXACHAT_RAG_EMBEDDING_DIM:256}
      timeout-ms: ${NEXACHAT_RAG_EMBEDDING_TIMEOUT_MS:20000}
      batch-size: ${NEXACHAT_RAG_EMBEDDING_BATCH_SIZE:32}
    retrieval:
      max-candidate-messages: ${NEXACHAT_RAG_MAX_CANDIDATE_MESSAGES:5000}
      lexical-candidate-limit: ${NEXACHAT_RAG_LEXICAL_CANDIDATE_LIMIT:300}
      lexical-term-limit: ${NEXACHAT_RAG_LEXICAL_TERM_LIMIT:8}
      vector-candidate-limit: ${NEXACHAT_RAG_VECTOR_CANDIDATE_LIMIT:200}
      neighbor-radius: ${NEXACHAT_RAG_NEIGHBOR_RADIUS:2}
      max-context-chars: ${NEXACHAT_RAG_MAX_CONTEXT_CHARS:3000}
      mmr-limit: ${NEXACHAT_RAG_MMR_LIMIT:12}
      mmr-lambda: ${NEXACHAT_RAG_MMR_LAMBDA:0.72}
      rrf-k: ${NEXACHAT_RAG_RRF_K:60}
      not-found-threshold: ${NEXACHAT_RAG_NOT_FOUND_THRESHOLD:0.18}
      extractive-threshold: ${NEXACHAT_RAG_EXTRACTIVE_THRESHOLD:0.62}
      semantic-cache-threshold: ${NEXACHAT_RAG_SEMANTIC_CACHE_THRESHOLD:0.92}
      max-snippet-chars: ${NEXACHAT_RAG_MAX_SNIPPET_CHARS:280}
    index:
      lazy-limit: ${NEXACHAT_RAG_INDEX_LAZY_LIMIT:500}
      backfill-rate-per-minute: ${NEXACHAT_RAG_BACKFILL_RATE_PER_MINUTE:200}
      cache-max-vectors: ${NEXACHAT_RAG_CACHE_MAX_VECTORS:4096}
      backfill-enabled: ${NEXACHAT_RAG_BACKFILL_ENABLED:true}
      backfill-interval-ms: ${NEXACHAT_RAG_BACKFILL_INTERVAL_MS:60000}
    ask:
      rate-limit-per-minute: ${NEXACHAT_RAG_ASK_RATE_LIMIT_PER_MINUTE:20}
      rate-limit-per-day: ${NEXACHAT_RAG_ASK_RATE_LIMIT_PER_DAY:200}
      cache-ttl-hours: ${NEXACHAT_RAG_ASK_CACHE_TTL_HOURS:24}
  fcm:
    enabled: ${FCM_ENABLED:false}
    project-id: ${FCM_PROJECT_ID:}
    # Inline service-account JSON or a filesystem path to it. Required when enabled.
    service-account-json: ${FCM_SERVICE_ACCOUNT_JSON:}
    # Optional endpoint overrides (blank in production: the Google URLs are used).
    token-uri: ${FCM_TOKEN_URI:}
    api-url: ${FCM_API_URL:}
    connect-timeout-seconds: ${FCM_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${FCM_READ_TIMEOUT_SECONDS:10}
    max-retries: ${FCM_MAX_RETRIES:2}
    retry-base-delay-ms: ${FCM_RETRY_BASE_DELAY_MS:200}
