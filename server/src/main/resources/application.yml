server:
  port: 8080

spring:
  mail:
    host: ${MAIL_SMTP_HOST:smtp.gmail.com}
    port: ${MAIL_SMTP_PORT:587}
    username: ${MAIL_SMTP_USERNAME:}
    password: ${MAIL_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true
            required: true
  # firebase-admin brings Apache HttpClient 5 onto the classpath; its default strategy silently
  # re-sends 429/503 responses. Pin auto-configured RestClient/RestTemplate to the JDK client.
  http:
    client:
      factory: jdk
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/nexachat}
    username: ${DATABASE_USER:nexachat}
    password: ${DATABASE_PASSWORD:nexachat}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
      # Keep the multipart body on disk: a 25 MB part must never sit in heap
      # twice (container buffer plus MultipartFile.getBytes()). Upload service
      # code copies the file once, under nexachat.uploads admission.
      file-size-threshold: 0B
      # Scratch directory for those parts. Empty keeps the servlet-container
      # temp directory (the JVM temp root in the image). A configured path is
      # created at boot and probe-written by MultipartTempDirectory, so an
      # unwritable mount fails startup instead of the first upload.
      location: ${NEXACHAT_MULTIPART_TEMP_DIR:}

management:
  # Actuator shares the API port by default so existing health checks keep working.
  # Set MANAGEMENT_SERVER_PORT (with MANAGEMENT_SERVER_ADDRESS=127.0.0.1) to move it
  # to a loopback-only port. Only health is exposed unless MANAGEMENT_EXPOSURE opts in.
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_EXPOSURE:health}
  endpoint:
    health:
      # Component names and statuses only; details (paths, versions, errors)
      # stay hidden from the public endpoint.
      show-details: never
      show-components: always
      group:
        liveness:
          include: ping
        readiness:
          include: db,flyway,diskSpace,refreshReplay
  health:
    mail:
      enabled: false
    diskspace:
      path: ${nexachat.storage.root}
      threshold: ${MANAGEMENT_DISK_THRESHOLD:1GB}
  prometheus:
    metrics:
      export:
        # The Prometheus registry must exist for /actuator/prometheus to be
        # available; the exposure flag above still controls visibility.
        enabled: ${MANAGEMENT_PROMETHEUS_ENABLED:true}

nexachat:
  observability:
    slow-query-threshold-ms: ${NEXACHAT_SLOW_QUERY_THRESHOLD_MS:500}
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-at-least-64-chars-long-0123456789}
    access-ttl-seconds: 900
    refresh-ttl-days: 14
  mail:
    provider: ${NEXACHAT_MAIL_PROVIDER:}
    from: ${RESEND_FROM:}
    smtp:
      host: ${MAIL_SMTP_HOST:smtp.gmail.com}
      port: ${MAIL_SMTP_PORT:587}
      username: ${MAIL_SMTP_USERNAME:}
      password: ${MAIL_SMTP_PASSWORD:}
      from: ${MAIL_FROM:}
    resend:
      api-key: ${RESEND_API_KEY:}
  auth:
    refresh-replay:
      key: ${NEXACHAT_REFRESH_REPLAY_KEY:}
      cleanup-batch-size: 500
  google:
    # "Sign in with Google" (OpenID Connect). Off by default; the owner creates
    # the OAuth clients in Google Cloud and supplies the web client ID.
    signin:
      enabled: ${NEXACHAT_GOOGLE_SIGNIN_ENABLED:false}
      web-client-id: ${NEXACHAT_GOOGLE_WEB_CLIENT_ID:}
      # Comma-separated Android OAuth client IDs trusted as the token's azp.
      android-client-ids: ${NEXACHAT_GOOGLE_ANDROID_CLIENT_IDS:}
      jwks-uri: ${NEXACHAT_GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}
      nonce-ttl-seconds: ${NEXACHAT_GOOGLE_NONCE_TTL_SECONDS:300}
  security:
    # Exact browser origins allowed to call the API. Empty admits no
    # cross-origin caller (the native app sends no Origin header); set this in
    # any deployment that also serves a web client.
    cors-allowed-origins: ${NEXACHAT_CORS_ALLOWED_ORIGINS:}
    # E.164 numbers allowed to read operator telemetry (/api/v1/rag/stats).
    admin-phones: ${NEXACHAT_ADMIN_PHONES:}
    # JSON request bodies above this size are rejected with 413.
    max-json-body-bytes: ${NEXACHAT_MAX_JSON_BODY_BYTES:1048576}
    # How long the JWT filter caches a user's access-token cutoff. Never
    # larger than the access-token lifetime.
    validity-cache-ttl-seconds: ${NEXACHAT_VALIDITY_CACHE_TTL_SECONDS:60}
    # Reverse-proxy CIDRs that may rewrite X-Forwarded-For (empty = never trust).
    trusted-proxy-cidrs: ${NEXACHAT_TRUSTED_PROXY_CIDRS:}
    # Header that carries the client address when the peer is a trusted proxy.
    # X-Forwarded-For is walked right-to-left; a single-value header such as
    # CF-Connecting-IP is used only when the edge overwrites it.
    client-ip-header: ${NEXACHAT_CLIENT_IP_HEADER:X-Forwarded-For}
  rate-limit:
    messages:
      edit-delete-per-minute: 30
      search-per-minute: 60
    stomp:
      messages-per-window: 30
      window-seconds: 10
      typing-per-window: 60
      typing-window-seconds: 10
      acks-per-window: 120
      ack-window-seconds: 10
  calls:
    ring-timeout-ms: ${NEXACHAT_CALLS_RING_TIMEOUT_MS:45000}
    disconnect-grace-ms: ${NEXACHAT_CALLS_DISCONNECT_GRACE_MS:15000}
  storage:
    provider: ${NEXACHAT_STORAGE_PROVIDER:local}
    root: ${STORAGE_ROOT:./data/uploads}
    s3:
      endpoint: ${NEXACHAT_STORAGE_S3_ENDPOINT:}
      region: ${NEXACHAT_STORAGE_S3_REGION:auto}
      bucket: ${NEXACHAT_STORAGE_S3_BUCKET:}
      access-key-id: ${NEXACHAT_STORAGE_S3_ACCESS_KEY_ID:}
      secret-access-key: ${NEXACHAT_STORAGE_S3_SECRET_ACCESS_KEY:}
  uploads:
    # Uploads buffer the whole file on the heap (25 MB max). Bound how many may
    # do so at once; the rest wait acquire-timeout-ms, then get 429
    # RATE_LIMITED with Retry-After. Lower this on a small heap (Render: 2).
    max-concurrent: ${NEXACHAT_UPLOADS_MAX_CONCURRENT:16}
    acquire-timeout-ms: ${NEXACHAT_UPLOADS_ACQUIRE_TIMEOUT_MS:1000}
  avatar-sweep:
    # Orphaned-avatar cleanup is opt-in; dry-run counts candidates until an
    # operator explicitly disables it. Only server-generated avatars/ keys
    # older than min-age-hours and referenced by no user or group row go.
    enabled: ${NEXACHAT_AVATAR_SWEEP_ENABLED:false}
    dry-run: ${NEXACHAT_AVATAR_SWEEP_DRY_RUN:true}
    batch-size: ${NEXACHAT_AVATAR_SWEEP_BATCH_SIZE:100}
    min-age-hours: ${NEXACHAT_AVATAR_SWEEP_MIN_AGE_HOURS:24}
    interval-ms: ${NEXACHAT_AVATAR_SWEEP_INTERVAL_MS:86400000}
  sync:
    # Delta clients that fall behind this window receive a full reaction refresh.
    reaction-retention-days: ${NEXACHAT_SYNC_REACTION_RETENTION_DAYS:30}
  retention:
    # Cleanup is globally opt-in; dry-run counts candidates until explicitly disabled.
    enabled: ${NEXACHAT_RETENTION_ENABLED:false}
    dry-run: ${NEXACHAT_RETENTION_DRY_RUN:true}
    batch-size: ${NEXACHAT_RETENTION_BATCH_SIZE:100}
    statement-timeout-ms: ${NEXACHAT_RETENTION_STATEMENT_TIMEOUT_MS:2000}
    transaction-timeout-seconds: ${NEXACHAT_RETENTION_TRANSACTION_TIMEOUT_SECONDS:15}
    interval-ms: ${NEXACHAT_RETENTION_INTERVAL_MS:3600000}
    jobs:
      join-requests:
        enabled: ${NEXACHAT_RETENTION_JOIN_REQUESTS_ENABLED:false}
        retention-days: ${NEXACHAT_RETENTION_JOIN_REQUESTS_RETENTION_DAYS:30}
      invite-bans:
        enabled: ${NEXACHAT_RETENTION_INVITE_BANS_ENABLED:false}
      invite-links:
        enabled: ${NEXACHAT_RETENTION_INVITE_LINKS_ENABLED:false}
        grace-days: ${NEXACHAT_RETENTION_INVITE_LINKS_GRACE_DAYS:30}
      idempotency:
        enabled: ${NEXACHAT_RETENTION_IDEMPOTENCY_ENABLED:false}
        ttl-hours: ${NEXACHAT_RETENTION_IDEMPOTENCY_TTL_HOURS:24}
      refresh-tokens:
        enabled: ${NEXACHAT_RETENTION_REFRESH_TOKENS_ENABLED:false}
        retention-days: ${NEXACHAT_RETENTION_REFRESH_TOKENS_RETENTION_DAYS:30}
      device-tokens:
        enabled: ${NEXACHAT_RETENTION_DEVICE_TOKENS_ENABLED:false}
        stale-days: ${NEXACHAT_RETENTION_DEVICE_TOKENS_STALE_DAYS:180}
      reminders:
        enabled: ${NEXACHAT_RETENTION_REMINDERS_ENABLED:false}
        retention-days: ${NEXACHAT_RETENTION_REMINDERS_RETENTION_DAYS:30}
      polls:
        enabled: ${NEXACHAT_RETENTION_POLLS_ENABLED:false}
        retention-days: ${NEXACHAT_RETENTION_POLLS_RETENTION_DAYS:365}
      call-records:
        enabled: ${NEXACHAT_RETENTION_CALL_RECORDS_ENABLED:false}
        retention-days: ${NEXACHAT_RETENTION_CALL_RECORDS_RETENTION_DAYS:365}
      attachments:
        enabled: ${NEXACHAT_RETENTION_ATTACHMENTS_ENABLED:false}
        unbound-hours: ${NEXACHAT_RETENTION_ATTACHMENTS_UNBOUND_HOURS:24}
        deleted-message-days: ${NEXACHAT_RETENTION_ATTACHMENTS_DELETED_MESSAGE_DAYS:30}
      message-tombstones:
        enabled: ${NEXACHAT_RETENTION_MESSAGE_TOMBSTONES_ENABLED:false}
        retention-days: ${NEXACHAT_RETENTION_MESSAGE_TOMBSTONES_RETENTION_DAYS:30}
      reaction-events:
        enabled: ${NEXACHAT_RETENTION_REACTION_EVENTS_ENABLED:false}
      summaries:
        enabled: ${NEXACHAT_RETENTION_SUMMARIES_ENABLED:false}
      summary-limits:
        enabled: ${NEXACHAT_RETENTION_SUMMARY_LIMITS_ENABLED:false}
        minute-retention-days: ${NEXACHAT_RETENTION_SUMMARY_LIMITS_MINUTE_DAYS:1}
        day-retention-days: ${NEXACHAT_RETENTION_SUMMARY_LIMITS_DAY_DAYS:2}
      rag-cache:
        enabled: ${NEXACHAT_RETENTION_RAG_CACHE_ENABLED:false}
      rag-limits:
        enabled: ${NEXACHAT_RETENTION_RAG_LIMITS_ENABLED:false}
        minute-retention-days: ${NEXACHAT_RETENTION_RAG_LIMITS_MINUTE_DAYS:1}
        day-retention-days: ${NEXACHAT_RETENTION_RAG_LIMITS_DAY_DAYS:2}
  presence:
    disconnect-coalesce-ms: 5000
  summary:
    provider: ${NEXACHAT_SUMMARY_PROVIDER:auto}
    complexity:
      min-messages: ${NEXACHAT_SUMMARY_COMPLEXITY_MIN_MESSAGES:12}
      min-chars: ${NEXACHAT_SUMMARY_COMPLEXITY_MIN_CHARS:1500}
      min-participants: ${NEXACHAT_SUMMARY_COMPLEXITY_MIN_PARTICIPANTS:4}
    llm:
      enabled: ${NEXACHAT_SUMMARY_LLM_ENABLED:false}
      base-url: ${NEXACHAT_SUMMARY_LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      model: ${NEXACHAT_SUMMARY_LLM_MODEL:gemini-3.1-flash-lite}
      api-key: ${NEXACHAT_SUMMARY_LLM_API_KEY:}
      timeout-ms: ${NEXACHAT_SUMMARY_LLM_TIMEOUT_MS:30000}
      max-input-chars: ${NEXACHAT_SUMMARY_LLM_MAX_INPUT_CHARS:24000}
      max-output-tokens: ${NEXACHAT_SUMMARY_LLM_MAX_OUTPUT_TOKENS:4000}
      # Dedicated Local Server Model Tier (Ollama / vLLM / local server model)
      local-enabled: ${NEXACHAT_SUMMARY_LOCAL_LLM_ENABLED:false}
      local-base-url: ${NEXACHAT_SUMMARY_LOCAL_LLM_BASE_URL:http://host.docker.internal:11434/v1}
      local-model: ${NEXACHAT_SUMMARY_LOCAL_LLM_MODEL:qwen2.5:3b}
      local-api-key: ${NEXACHAT_SUMMARY_LOCAL_LLM_API_KEY:local-ollama}
      local-timeout-ms: ${NEXACHAT_SUMMARY_LOCAL_LLM_TIMEOUT_MS:60000}
    # Fallback cloud provider: tried once when the primary fails retryably.
    # Disabled by default; it activates only when enabled and its key is configured.
    llm-fallback:
      enabled: ${NEXACHAT_SUMMARY_LLM_FALLBACK_ENABLED:false}
      base-url: ${NEXACHAT_SUMMARY_LLM_FALLBACK_BASE_URL:https://api.deepseek.com}
      model: ${NEXACHAT_SUMMARY_LLM_FALLBACK_MODEL:deepseek-flash}
      api-key: ${NEXACHAT_SUMMARY_LLM_FALLBACK_API_KEY:}
      timeout-ms: ${NEXACHAT_SUMMARY_LLM_FALLBACK_TIMEOUT_MS:30000}
  rag:
    enabled: ${NEXACHAT_RAG_ENABLED:true}
    embedding:
      provider: ${NEXACHAT_RAG_EMBEDDING_PROVIDER:lexical}
      mode: ${NEXACHAT_RAG_EMBEDDING_MODE:openai-compatible}
      base-url: ${NEXACHAT_RAG_EMBEDDING_BASE_URL:}
      model: ${NEXACHAT_RAG_EMBEDDING_MODEL:gemini-embedding-001}
      api-key: ${NEXACHAT_RAG_EMBEDDING_API_KEY:${NEXACHAT_SUMMARY_LLM_API_KEY:}}
      dim: ${NEXACHAT_RAG_EMBEDDING_DIM:256}
      timeout-ms: ${NEXACHAT_RAG_EMBEDDING_TIMEOUT_MS:20000}
      batch-size: ${NEXACHAT_RAG_EMBEDDING_BATCH_SIZE:32}
    retrieval:
      max-candidate-messages: ${NEXACHAT_RAG_MAX_CANDIDATE_MESSAGES:5000}
      lexical-candidate-limit: ${NEXACHAT_RAG_LEXICAL_CANDIDATE_LIMIT:300}
      lexical-term-limit: ${NEXACHAT_RAG_LEXICAL_TERM_LIMIT:8}
      vector-candidate-limit: ${NEXACHAT_RAG_VECTOR_CANDIDATE_LIMIT:200}
      neighbor-radius: ${NEXACHAT_RAG_NEIGHBOR_RADIUS:2}
      max-context-chars: ${NEXACHAT_RAG_MAX_CONTEXT_CHARS:3000}
      mmr-limit: ${NEXACHAT_RAG_MMR_LIMIT:12}
      mmr-lambda: ${NEXACHAT_RAG_MMR_LAMBDA:0.72}
      rrf-k: ${NEXACHAT_RAG_RRF_K:60}
      not-found-threshold: ${NEXACHAT_RAG_NOT_FOUND_THRESHOLD:0.18}
      extractive-threshold: ${NEXACHAT_RAG_EXTRACTIVE_THRESHOLD:0.62}
      semantic-cache-threshold: ${NEXACHAT_RAG_SEMANTIC_CACHE_THRESHOLD:0.92}
      max-snippet-chars: ${NEXACHAT_RAG_MAX_SNIPPET_CHARS:280}
    index:
      lazy-limit: ${NEXACHAT_RAG_INDEX_LAZY_LIMIT:500}
      backfill-rate-per-minute: ${NEXACHAT_RAG_BACKFILL_RATE_PER_MINUTE:200}
      cache-max-vectors: ${NEXACHAT_RAG_CACHE_MAX_VECTORS:4096}
      backfill-enabled: ${NEXACHAT_RAG_BACKFILL_ENABLED:true}
      backfill-interval-ms: ${NEXACHAT_RAG_BACKFILL_INTERVAL_MS:60000}
    ask:
      rate-limit-per-minute: ${NEXACHAT_RAG_ASK_RATE_LIMIT_PER_MINUTE:20}
      rate-limit-per-day: ${NEXACHAT_RAG_ASK_RATE_LIMIT_PER_DAY:200}
      cache-ttl-hours: ${NEXACHAT_RAG_ASK_CACHE_TTL_HOURS:24}
  fcm:
    enabled: ${FCM_ENABLED:false}
    project-id: ${FCM_PROJECT_ID:}
    # Inline service-account JSON or a filesystem path to it. Required when enabled.
    service-account-json: ${FCM_SERVICE_ACCOUNT_JSON:}
    # Optional endpoint overrides (blank in production: the Google URLs are used).
    token-uri: ${FCM_TOKEN_URI:}
    api-url: ${FCM_API_URL:}
    connect-timeout-seconds: ${FCM_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${FCM_READ_TIMEOUT_SECONDS:10}
    max-retries: ${FCM_MAX_RETRIES:2}
    retry-base-delay-ms: ${FCM_RETRY_BASE_DELAY_MS:200}
  firebase:
    realtime-enabled: ${FIREBASE_REALTIME_ENABLED:false}
    realtime-default: ${FIREBASE_REALTIME_DEFAULT:stomp}
    call-status-enabled: ${FIREBASE_CALL_STATUS_ENABLED:false}
    database-url: ${FIREBASE_DATABASE_URL:}
    connect-timeout-seconds: ${FIREBASE_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${FIREBASE_READ_TIMEOUT_SECONDS:10}
