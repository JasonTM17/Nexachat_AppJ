# Render Free runtime profile (0.1 CPU / 512 MB).
#
# Activated only when SPRING_PROFILES_ACTIVE includes `render`
# (render.yaml sets `prod,render,json-logs`). Compose, standalone and test
# deployments never load this file, so their defaults are unchanged.
#
# The JVM side of the fit lives in render.yaml JAVA_OPTS; this file sizes the
# two thread pools that would otherwise assume a full server.

server:
  tomcat:
    threads:
      # 0.1 CPU cannot use Tomcat's default 200 request threads; a small pool
      # keeps the 512 MB box from spending memory on idle stacks.
      max: 20
      min-spare: 2
    accept-count: 50
    max-connections: 200

spring:
  datasource:
    hikari:
      # Neon free compute (0.25 CU) allows 105 application connections
      # (https://neon.com/docs/connect/connection-pooling). One Render instance
      # with a direct (non-pooled) connection needs far fewer.
      maximum-pool-size: 5
      # Hold no idle connection, so Neon Free can suspend its compute (after 5
      # idle minutes) while an uptime monitor keeps this service awake.
      minimum-idle: 0
      idle-timeout: 60000
      connection-timeout: 20000
      validation-timeout: 3000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

# Background jobs that need no prompt schedule run far apart here, so they do
# not keep the Neon compute awake. RAG indexes lazily at query time; expired
# refresh-replay payloads are already unusable.
nexachat:
  rag:
    index:
      backfill-interval-ms: 1800000
  auth:
    refresh-replay:
      cleanup-interval-ms: 1800000
  # Each in-flight upload buffers up to 25 MB on a heap already near 380 MB
  # after boot; two at a time keeps a burst under the 512 MB limit.
  uploads:
    max-concurrent: 2
