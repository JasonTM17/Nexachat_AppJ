# Production overrides. Everything not listed here inherits from application.yml.
#
# TLS / WSS
# ---------
# TLS is terminated at the reverse proxy in front of this service
# (nginx / Caddy / Traefik). The app itself serves plain HTTP + ws:// inside the
# trusted network; `server.forward-headers-strategy=framework` makes Spring
# honor X-Forwarded-Proto/Host so redirects and generated URLs use https/wss.
# Per-IP rate limits use the socket peer unless the peer is listed in
# `nexachat.security.trusted-proxy-cidrs` — see docs/operations.md.
#
# DEV-ONLY: `adb reverse tcp:8080 tcp:8080` and plain ws:// to a LAN IP are
# local development conveniences (see docs/operations.md). Never expose this
# service without TLS in a real deployment.
#
# Secrets
# -------
# JWT_SECRET has no default here: startup fails fast when it is unset.
# Database coordinates and storage also have no production defaults. Compose
# supplies them from the ignored .env file; standalone deployments must inject
# the same variables through their runtime secret/configuration provider.

server:
  forward-headers-strategy: framework
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript
    min-response-size: 1024
  error:
    include-exception: false
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

logging:
  level:
    root: INFO
    com.nexachat: INFO

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jpa:
    open-in-view: false
  flyway:
    validate-on-migrate: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
    mapper:
      accept-case-insensitive-enums: false
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Two default prod instances × 10 connections stays below Postgres max_connections=100.
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

management:
  endpoints:
    web:
      exposure:
        include: health

nexachat:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-seconds: 900
    refresh-ttl-days: 14
  storage:
    root: ${STORAGE_ROOT}
