# "it" profile — integration tests against a real PostgreSQL.
#
# Unlike application-test.yml, NOTHING is excluded here: datasource, JPA and
# Flyway autoconfiguration all run for real, so V1__init.sql is applied on
# boot. JDBC coordinates come from the test's @DynamicPropertySource
# (IT_DB_URL/IT_DB_USER/IT_DB_PASSWORD, defaulting to the local docker-compose
# instance on :5433) — do not hardcode a datasource URL in this file.
spring:
  datasource:
    hikari:
      # Many cached Spring contexts share one PostgreSQL (max_connections=100);
      # small pools keep the whole failsafe run under that ceiling.
      maximum-pool-size: 2
      minimum-idle: 0
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

# Integration tests keep actuator on the main server port (management port =
# server.port) so the security ITs can reach /actuator/health there. The
# observability health IT overrides this with a dedicated management port.
management:
  server:
    port: ${server.port}
  endpoint:
    health:
      validate-group-membership: false

nexachat:
  presence:
    # PresenceFlowIT verifies the real STOMP lifecycle without waiting five seconds.
    disconnect-coalesce-ms: 0
  calls:
    disconnect-grace-ms: 100
  reminders:
    # Integration tests drive the scheduler explicitly for determinism.
    enabled: false
  jwt:
    # Fixed HS256 secret (>= 32 bytes) — ITs must not depend on env vars.
    secret: "it-only-secret-0123456789abcdef-not-for-prod"
