# Keep Maven test forks deterministic when the developer environment exports
# Spring relaxed-binding names such as NEXACHAT_RAG_ENABLED. application-it.yml
# carries the same intended values for the integration-test profile.
# Bound cached contexts because each retains a small PostgreSQL pool; this
# keeps sequential and concurrent verify runs below PostgreSQL's connection cap.
spring.test.context.cache.maxSize=8
nexachat.observability.slow-query-threshold-ms=500
nexachat.jwt.secret=it-only-secret-0123456789abcdef-not-for-prod
nexachat.security.cors-allowed-origins=
nexachat.security.admin-phones=
nexachat.security.max-json-body-bytes=1048576
nexachat.security.validity-cache-ttl-seconds=60
