nexachat.rate-limit.messages.search-per-minute=60
nexachat.rate-limit.stomp.messages-per-window=30
nexachat.rate-limit.stomp.window-seconds=10
nexachat.rate-limit.stomp.typing-per-window=60
nexachat.rate-limit.stomp.typing-window-seconds=10
nexachat.rate-limit.stomp.acks-per-window=120
nexachat.rate-limit.stomp.ack-window-seconds=10
nexachat.rate-limit.reminders.create-per-minute=30
nexachat.rate-limit.polls.create-per-minute=10
nexachat.rate-limit.polls.votes-per-minute=120
nexachat.rate-limit.polls.manage-per-minute=30
nexachat.calls.ring-timeout-ms=45000
nexachat.calls.disconnect-grace-ms=100
