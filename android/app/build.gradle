import java.util.Properties

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.hilt)
}

// `google-services.json` is a gitignored local file: apply the plugin only when it is
// present so a fresh clone without it still builds and the no-Firebase code path is
// exercised. The plugin fails the build on a malformed file when it is present.
def googleServicesJsonFile = file('google-services.json')
boolean googleServicesJsonPresent = googleServicesJsonFile.isFile()
if (googleServicesJsonPresent) {
    apply plugin: 'com.google.gms.google-services'
}
logger.lifecycle("Firebase configured: ${googleServicesJsonPresent ? 'yes' : 'no'}")

// Backend base URL for BuildConfig.API_BASE_URL — local.properties
// (`API_BASE_URL=...`) beats the default; -PapiBaseUrl beats both.
def localProps = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { input -> localProps.load(input) }
}

def releaseSigningPropertiesFile = rootProject.file('../release/keystore/signing.properties')
def releaseSigningProperties = new Properties()
if (releaseSigningPropertiesFile.isFile()) {
    releaseSigningPropertiesFile.withInputStream { input -> releaseSigningProperties.load(input) }
}
def releaseSigningKeys = [
    'storeFile',
    'keyAlias',
    'keystore.storePassword',
    'keyPassword'
]
if (releaseSigningPropertiesFile.isFile()) {
    def missingSigningKeys = releaseSigningKeys.findAll {
        !releaseSigningProperties.getProperty(it)?.trim()
    }
    if (!missingSigningKeys.isEmpty()) {
        throw new IllegalArgumentException(
            "release/keystore/signing.properties is missing required entries: ${missingSigningKeys.join(', ')}"
        )
    }
    if (!rootProject.file("../${releaseSigningProperties.getProperty('storeFile')}").isFile()) {
        throw new IllegalArgumentException('The keystore configured in release/keystore/signing.properties does not exist')
    }
}

def apiBaseUrl = providers.gradleProperty('apiBaseUrl')
    .orElse(localProps.getProperty('API_BASE_URL') ?: 'http://10.0.2.2:8080')

android {
    namespace 'com.nexachat'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nexachat'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ['room.schemaLocation': "$projectDir/schemas".toString()]
            }
        }

        ndk {
            abiFilters += ['arm64-v8a', 'x86_64']
        }

        // Backend base URL — override in local.properties (LAN demo) or via
        // -PapiBaseUrl=...; defaults to the emulator's host-loopback alias.
        buildConfigField 'String', 'API_BASE_URL', "\"${apiBaseUrl.get()}\""
    }

    signingConfigs {
        if (releaseSigningPropertiesFile.isFile()) {
            release {
                storeFile rootProject.file("../${releaseSigningProperties.getProperty('storeFile')}")
                storePassword releaseSigningProperties.getProperty('keystore.storePassword')
                keyAlias releaseSigningProperties.getProperty('keyAlias')
                keyPassword releaseSigningProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig releaseSigningPropertiesFile.isFile() ?
                signingConfigs.getByName('release') : signingConfigs.getByName('debug')
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    sourceSets {
        getByName('androidTest').assets.srcDir("$projectDir/schemas")
    }
}

gradle.taskGraph.whenReady { graph ->
    def releasePackagingRequested = graph.allTasks.any { task ->
        task.path == ':app:assembleRelease' ||
            task.path == ':app:packageRelease' ||
            task.path == ':app:bundleRelease'
    }
    if (releasePackagingRequested && !releaseSigningPropertiesFile.isFile()) {
        logger.warn(
            'WARNING: release/keystore/signing.properties is missing; this release artifact is ' +
                'signed with the debug key and is for local verification only.'
        )
    }
}

// Reports the Firebase configuration state per variant. Prints package names and
// booleans only — never API keys, app ids, or other values from google-services.json.
def generatedValuesByVariant = ['debug', 'release'].collectEntries { variant ->
    def capitalized = variant.capitalize()
    [variant, [
        file("build/generated/res/process${capitalized}GoogleServices/values/values.xml"),
        file("build/generated/res/google-services/${variant}/values/values.xml")
    ]]
}

tasks.register('checkFirebaseConfig') {
    group = 'verification'
    description = 'Reports whether google-services.json produced Firebase resources for each variant.'
    dependsOn tasks.matching { it.name ==~ /process(Debug|Release)GoogleServices/ }
    doLast {
        if (!googleServicesJsonPresent) {
            logger.lifecycle('Firebase configured: no')
            return
        }
        def json = new groovy.json.JsonSlurper().parse(googleServicesJsonFile)
        def clientPackages = json.client
            .collect { it.client_info?.android_client_info?.package_name }
            .findAll { it != null }
        def appIds = [:]
        ['debug', 'release'].each { variant ->
            def expectedPackage = variant == 'debug' ? 'com.nexachat.debug' : 'com.nexachat'
            def packageResolved = clientPackages.contains(expectedPackage)
            def generated = generatedValuesByVariant[variant].find { it.isFile() }
            def hasAppId = false
            def hasWebClientId = false
            if (generated != null) {
                def resources = new XmlSlurper().parse(generated)
                def appId = resources.string.find { it.@name == 'google_app_id' }
                hasAppId = appId != null && appId.text().trim() ? true : false
                appIds[variant] = hasAppId ? appId.text().trim() : null
                hasWebClientId = resources.string.any {
                    it.@name == 'default_web_client_id' && it.text().trim()
                }
            }
            logger.lifecycle("Firebase configured: ${packageResolved && hasAppId ? 'yes' : 'no'} " +
                "(variant=${variant}, client=${expectedPackage}, resolved=${packageResolved}, " +
                "google_app_id=${hasAppId}, default_web_client_id=${hasWebClientId})")
        }
        if (appIds.debug != null && appIds.release != null) {
            logger.lifecycle("Firebase debug and release app ids differ: ${appIds.debug != appIds.release}")
        }
    }
}

dependencies {
    coreLibraryDesugaring(libs.desugar.jdk.libs)

    // Activity / Navigation / Lifecycle / Views
    implementation(libs.androidx.appcompat)
    implementation(libs.material)
    implementation(libs.androidx.constraintlayout)
    implementation(libs.androidx.recyclerview)
    implementation(libs.androidx.fragment)
    implementation(libs.androidx.navigation.fragment)
    implementation(libs.androidx.navigation.ui)
    implementation(libs.androidx.swiperefreshlayout)
    implementation(libs.bundles.lifecycle)

    // Hilt DI (Java annotationProcessor)
    implementation(libs.hilt.android)
    annotationProcessor(libs.hilt.android.compiler)

    // Room — local source of truth (offline-first, plan §12.2)
    implementation(libs.bundles.room)
    annotationProcessor(libs.androidx.room.compiler)

    // Network — Retrofit/REST + OkHttp (also used for the STOMP-over-WS client)
    implementation(libs.bundles.network)

    // Local storage — TokenStore / prefs (plan §12.1 core/storage)
    implementation(libs.androidx.datastore.preferences)
    implementation(libs.androidx.datastore.rxjava3)

    // Reactive streams (RxJava3)
    implementation(libs.rxjava)
    implementation(libs.rxandroid)

    // Image loading (avatars, media messages)
    implementation(libs.glide)
    annotationProcessor(libs.glide.compiler)

    // Media playback — voice/video messages
    implementation(libs.bundles.media3)

    // In-app audio calls
    implementation(libs.stream.webrtc)

    // E.164 phone normalization
    implementation(libs.libphonenumber)

    // WorkManager (Outbox sync worker)
    implementation(libs.androidx.work.runtime)
    implementation(libs.androidx.work.rxjava3)

    // Firebase Cloud Messaging (Push notifications)
    implementation(libs.firebase.messaging)

    // Unit tests
    testImplementation(libs.bundles.unit.test)

    // Instrumented tests
    androidTestImplementation(libs.androidx.test.ext.junit)
    androidTestImplementation(libs.androidx.test.runner)
    androidTestImplementation(libs.androidx.room.testing)
    androidTestImplementation(libs.hilt.android.testing)
    androidTestAnnotationProcessor(libs.hilt.android.compiler)
}

tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
}
