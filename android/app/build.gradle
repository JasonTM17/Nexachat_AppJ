import java.util.Properties

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.hilt)
}

// Backend base URL for BuildConfig.API_BASE_URL — local.properties
// (`API_BASE_URL=...`) beats the default; -PapiBaseUrl beats both.
def localProps = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { input -> localProps.load(input) }
}

// Release signing configuration:
// Evaluated from Gradle properties, environment variables, or release/keystore/signing.properties.
// CI/local unsigned packaging is enabled via -PskipSigning (or SKIP_SIGNING=true).
def skipSigningProp = providers.gradleProperty('skipSigning')
    .orElse(providers.environmentVariable('SKIP_SIGNING'))
    .orNull
def skipSigning = project.hasProperty('skipSigning') || (skipSigningProp != null && (skipSigningProp == '' || skipSigningProp.toBoolean()))

def fileSigningProps = new Properties()
def releaseSigningPropertiesFile = rootProject.file('../release/keystore/signing.properties')
if (!releaseSigningPropertiesFile.isFile()) {
    releaseSigningPropertiesFile = rootProject.file('release/keystore/signing.properties')
}
if (releaseSigningPropertiesFile.isFile()) {
    releaseSigningPropertiesFile.withInputStream { input -> fileSigningProps.load(input) }
}

def releaseStoreFilePath = providers.gradleProperty('releaseStoreFile')
    .orElse(providers.environmentVariable('RELEASE_STORE_FILE'))
    .orNull ?: fileSigningProps.getProperty('storeFile')

def releaseStorePassword = providers.gradleProperty('releaseStorePassword')
    .orElse(providers.environmentVariable('RELEASE_STORE_PASSWORD'))
    .orNull ?: fileSigningProps.getProperty('keystore.storePassword')

def releaseKeyAlias = providers.gradleProperty('releaseKeyAlias')
    .orElse(providers.environmentVariable('RELEASE_KEY_ALIAS'))
    .orNull ?: fileSigningProps.getProperty('keyAlias')

def releaseKeyPassword = providers.gradleProperty('releaseKeyPassword')
    .orElse(providers.environmentVariable('RELEASE_KEY_PASSWORD'))
    .orNull ?: fileSigningProps.getProperty('keyPassword')

def hasReleaseSigning = releaseStoreFilePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

File resolveStoreFile(String path) {
    if (!path) return null
    File f = new File(path)
    if (f.isAbsolute()) return f
    File fromRoot = rootProject.file(path)
    if (fromRoot.exists()) return fromRoot
    File fromRepo = rootProject.file("../${path}")
    if (fromRepo.exists()) return fromRepo
    return fromRoot
}

File resolvedStoreFile = hasReleaseSigning ? resolveStoreFile(releaseStoreFilePath) : null


def apiBaseUrl = providers.gradleProperty('apiBaseUrl')
    .orElse(localProps.getProperty('API_BASE_URL') ?: 'http://10.0.2.2:8080')

android {
    namespace 'com.nexachat'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nexachat'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ['room.schemaLocation': "$projectDir/schemas".toString()]
            }
        }

        ndk {
            abiFilters += ['arm64-v8a', 'x86_64']
        }

        // Backend base URL — override in local.properties (LAN demo) or via
        // -PapiBaseUrl=...; defaults to the emulator's host-loopback alias.
        buildConfigField 'String', 'API_BASE_URL', "\"${apiBaseUrl.get()}\""
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile resolvedStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig = (hasReleaseSigning && !skipSigning) ? signingConfigs.getByName('release') : null
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    sourceSets {
        getByName('androidTest').assets.srcDir("$projectDir/schemas")
    }
}

gradle.taskGraph.whenReady { graph ->
    def releasePackagingRequested = graph.allTasks.any { task ->
        task.path in [':app:assembleRelease', ':app:packageRelease', ':app:bundleRelease', ':app:validateSigningRelease'] ||
            task.name in ['assembleRelease', 'packageRelease', 'bundleRelease', 'validateSigningRelease']
    }
    if (releasePackagingRequested && !skipSigning) {
        if (!hasReleaseSigning) {
            throw new GradleException(
                'Release build requested but signing configuration is missing. ' +
                'Provide signing credentials via environment variables ' +
                '(RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD), ' +
                'Gradle properties (-PreleaseStoreFile=..., -PreleaseStorePassword=..., -PreleaseKeyAlias=..., -PreleaseKeyPassword=...), ' +
                'or pass -PskipSigning for unsigned artifacts.'
            )
        }
        if (resolvedStoreFile == null || !resolvedStoreFile.isFile()) {
            throw new GradleException(
                "Configured release keystore file does not exist: ${resolvedStoreFile ? resolvedStoreFile.absolutePath : releaseStoreFilePath}"
            )
        }
    }
}

dependencies {
    coreLibraryDesugaring(libs.desugar.jdk.libs)

    // Activity / Navigation / Lifecycle / Views
    implementation(libs.androidx.appcompat)
    implementation(libs.material)
    implementation(libs.androidx.constraintlayout)
    implementation(libs.androidx.recyclerview)
    implementation(libs.androidx.fragment)
    implementation(libs.androidx.navigation.fragment)
    implementation(libs.androidx.navigation.ui)
    implementation(libs.androidx.swiperefreshlayout)
    implementation(libs.bundles.lifecycle)

    // Hilt DI (Java annotationProcessor)
    implementation(libs.hilt.android)
    annotationProcessor(libs.hilt.android.compiler)

    // Room — local source of truth (offline-first, plan §12.2)
    implementation(libs.bundles.room)
    annotationProcessor(libs.androidx.room.compiler)

    // Network — Retrofit/REST + OkHttp (also used for the STOMP-over-WS client)
    implementation(libs.bundles.network)

    // Local storage — TokenStore / prefs (plan §12.1 core/storage)
    implementation(libs.androidx.datastore.preferences)
    implementation(libs.androidx.datastore.rxjava3)

    // Reactive streams (RxJava3)
    implementation(libs.rxjava)
    implementation(libs.rxandroid)

    // Image loading (avatars, media messages)
    implementation(libs.glide)
    annotationProcessor(libs.glide.compiler)

    // Media playback — voice/video messages
    implementation(libs.bundles.media3)

    // In-app audio calls
    implementation(libs.stream.webrtc)

    // E.164 phone normalization
    implementation(libs.libphonenumber)

    // WorkManager (Outbox sync worker)
    implementation(libs.androidx.work.runtime)
    implementation(libs.androidx.work.rxjava3)

    // Firebase Cloud Messaging (Push notifications)
    implementation(libs.firebase.messaging)

    // Unit tests
    testImplementation(libs.bundles.unit.test)

    // Instrumented tests
    androidTestImplementation(libs.androidx.test.ext.junit)
    androidTestImplementation(libs.androidx.test.runner)
    androidTestImplementation(libs.androidx.room.testing)
    androidTestImplementation(libs.hilt.android.testing)
    androidTestAnnotationProcessor(libs.hilt.android.compiler)
}

tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
}
