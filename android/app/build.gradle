import java.util.Properties
import java.util.Locale

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.hilt)
}

// `google-services.json` is a gitignored local file: apply the plugin only when it is
// present so a fresh clone without it still builds and the no-Firebase code path is
// exercised. The plugin fails the build on a malformed file when it is present.
def googleServicesJsonFile = file('google-services.json')
boolean googleServicesJsonPresent = googleServicesJsonFile.isFile()
if (googleServicesJsonPresent) {
    apply plugin: 'com.google.gms.google-services'
}
logger.lifecycle("Firebase configured: ${googleServicesJsonPresent ? 'yes' : 'no'}")

// Backend base URL for BuildConfig.API_BASE_URL — local.properties
// (`API_BASE_URL=...`) beats the default; -PapiBaseUrl beats both.
def localProps = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { input -> localProps.load(input) }
}

// Release signing configuration:
// Evaluated from Gradle properties, environment variables, or release/keystore/signing.properties.
// CI/local unsigned packaging is enabled via -PskipSigning (or SKIP_SIGNING=true).
def skipSigningProp = providers.gradleProperty('skipSigning')
    .orElse(providers.environmentVariable('SKIP_SIGNING'))
    .orNull
def skipSigning = project.hasProperty('skipSigning') || (skipSigningProp != null && (skipSigningProp == '' || skipSigningProp.toBoolean()))

def fileSigningProps = new Properties()
def releaseSigningPropertiesFile = rootProject.file('../release/keystore/signing.properties')
if (!releaseSigningPropertiesFile.isFile()) {
    releaseSigningPropertiesFile = rootProject.file('release/keystore/signing.properties')
}
if (releaseSigningPropertiesFile.isFile()) {
    releaseSigningPropertiesFile.withInputStream { input -> fileSigningProps.load(input) }
}

def releaseStoreFilePath = providers.gradleProperty('releaseStoreFile')
    .orElse(providers.environmentVariable('RELEASE_STORE_FILE'))
    .orNull ?: fileSigningProps.getProperty('storeFile')

def releaseStorePassword = providers.gradleProperty('releaseStorePassword')
    .orElse(providers.environmentVariable('RELEASE_STORE_PASSWORD'))
    .orNull ?: fileSigningProps.getProperty('keystore.storePassword')

def releaseKeyAlias = providers.gradleProperty('releaseKeyAlias')
    .orElse(providers.environmentVariable('RELEASE_KEY_ALIAS'))
    .orNull ?: fileSigningProps.getProperty('keyAlias')

def releaseKeyPassword = providers.gradleProperty('releaseKeyPassword')
    .orElse(providers.environmentVariable('RELEASE_KEY_PASSWORD'))
    .orNull ?: fileSigningProps.getProperty('keyPassword')

def hasReleaseSigning = releaseStoreFilePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

File resolveStoreFile(String path) {
    if (!path) return null
    File f = new File(path)
    if (f.isAbsolute()) return f
    File fromRoot = rootProject.file(path)
    if (fromRoot.exists()) return fromRoot
    File fromRepo = rootProject.file("../${path}")
    if (fromRepo.exists()) return fromRepo
    return fromRoot
}

File resolvedStoreFile = hasReleaseSigning ? resolveStoreFile(releaseStoreFilePath) : null


def apiBaseUrl = providers.gradleProperty('apiBaseUrl')
    .orElse(localProps.getProperty('API_BASE_URL') ?: 'http://10.0.2.2:8080')
def firebaseRealtimeEnabled = providers.gradleProperty('firebaseRealtimeEnabled')
    .map { it.toBoolean() }
    .orElse(false)
    .get()
def firebaseCallStatusEnabled = providers.gradleProperty('firebaseCallStatusEnabled')
    .map { it.toBoolean() }
    .orElse(false)
    .get() && firebaseRealtimeEnabled

// Web OAuth client ID for "Sign in with Google". Fed by -PgoogleWebClientId=
// (or GOOGLE_WEB_CLIENT_ID in local.properties); empty hides every Google entry
// point so a build without OAuth clients still works.
def googleWebClientId = providers.gradleProperty('googleWebClientId')
    .orElse(localProps.getProperty('GOOGLE_WEB_CLIENT_ID') ?: '')
    .get().trim()
if (!googleWebClientId.isEmpty()
        && !googleWebClientId.endsWith('.apps.googleusercontent.com')) {
    throw new GradleException(
        'googleWebClientId must be the OAuth Web application client ID ending in .apps.googleusercontent.com.')
}
// Host for verified App Links (Phase 1 owned domain).
// Configured for the release build type only. Debug and localSmoke keep the host
// empty so local developers are not tied to the owned domain.
def inviteLinkHttpsHostProp = providers.gradleProperty('inviteLinkHttpsHost').orElse('').get().trim()
def releaseInviteLinkHttpsHost = inviteLinkHttpsHostProp.isEmpty() ? 'nexachat.io.vn' : inviteLinkHttpsHostProp
// NavInflater rejects an empty deepLink uri. Non-release builds have no HTTPS
// host, so they repeat the custom-scheme pattern already declared on the invite
// destination. That second link is a duplicate, not an HTTPS registration.
def nonReleaseInviteDeepLinkPattern = 'nexachat://join/{token}'
def inviteHostPattern = /(?=.{1,253}$)[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*/
if (!releaseInviteLinkHttpsHost.isEmpty() && !(releaseInviteLinkHttpsHost ==~ inviteHostPattern)) {
    throw new GradleException(
        'inviteLinkHttpsHost must be a DNS host only, without a scheme, port, path, or wildcard.'
    )
}
releaseInviteLinkHttpsHost = releaseInviteLinkHttpsHost.toLowerCase(Locale.ROOT)

def generatedReleaseManifest = layout.buildDirectory
    .file('generated/invite-link/release/AndroidManifest.xml').get().asFile
def generateReleaseInviteManifest = tasks.register('generateReleaseInviteManifest') {
    inputs.property('releaseInviteLinkHttpsHost', releaseInviteLinkHttpsHost)
    outputs.file(generatedReleaseManifest)
    doLast {
        generatedReleaseManifest.parentFile.mkdirs()
        generatedReleaseManifest.setText("""<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <application>
        <activity
            android:name=".MainActivity">
            <intent-filter android:autoVerify="true">
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data
                    android:scheme="https"
                    android:host="\${inviteLinkHttpsHost}"
                    android:pathPrefix="/join/" />
            </intent-filter>
        </activity>
    </application>
</manifest>
""", 'UTF-8')
    }
}

// The signed release helper supplies these from its semantic version tag.
// Direct Gradle builds keep the repository's existing defaults.
def releaseVersionName = providers.gradleProperty('releaseVersionName').orElse('1.0.0').get()
def releaseVersionCodeText = providers.gradleProperty('releaseVersionCode').orElse('1').get()
if (releaseVersionName.trim().isEmpty()) {
    throw new GradleException('Release version name must not be blank.')
}
if (!(releaseVersionCodeText ==~ /\d+/)) {
    throw new GradleException('Release version code must be a positive integer no greater than 2100000000.')
}
def releaseVersionCode = releaseVersionCodeText.toBigInteger()
if (releaseVersionCode < 1 || releaseVersionCode > 2100000000) {
    throw new GradleException('Release version code must be a positive integer no greater than 2100000000.')
}

android {
    namespace 'com.nexachat'
    compileSdk 36

    defaultConfig {
        applicationId 'com.nexachat'
        minSdk 26
        targetSdk 36
        versionCode releaseVersionCode.intValue()
        versionName releaseVersionName

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ['room.schemaLocation': "$projectDir/schemas".toString()]
            }
        }

        ndk {
            abiFilters += ['arm64-v8a', 'x86_64']
        }

        // Backend base URL — override in local.properties (LAN demo) or via
        // -PapiBaseUrl=...; defaults to the emulator's host-loopback alias.
        buildConfigField 'String', 'API_BASE_URL', "\"${apiBaseUrl.get()}\""
        buildConfigField 'boolean', 'FIREBASE_REALTIME_ENABLED', "${firebaseRealtimeEnabled}"
        buildConfigField 'boolean', 'FIREBASE_CALL_STATUS_ENABLED', "${firebaseCallStatusEnabled}"
        buildConfigField 'String', 'GOOGLE_WEB_CLIENT_ID', "\"${googleWebClientId}\""
        buildConfigField 'String', 'INVITE_LINK_HTTPS_HOST', '""'
        manifestPlaceholders = [inviteLinkHttpsHost: '']
        resValue 'string', 'invite_https_deep_link_pattern', nonReleaseInviteDeepLinkPattern
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile resolvedStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig = (hasReleaseSigning && !skipSigning) ? signingConfigs.getByName('release') : null
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Release uses the verified domain for App Links and invite sharing
            buildConfigField 'String', 'INVITE_LINK_HTTPS_HOST', "\"${releaseInviteLinkHttpsHost}\""
            manifestPlaceholders = [inviteLinkHttpsHost: releaseInviteLinkHttpsHost]
            resValue 'string', 'invite_https_deep_link_pattern', "https://${releaseInviteLinkHttpsHost}/join/{token}"
        }
        debug {
            applicationIdSuffix '.debug'
            // Debug and localSmoke leave INVITE_LINK_HTTPS_HOST empty so developers are not tied to the domain.
            // The nav pattern stays the custom scheme so the graph can inflate without an HTTPS filter.
            buildConfigField 'String', 'INVITE_LINK_HTTPS_HOST', '""'
            manifestPlaceholders = [inviteLinkHttpsHost: '']
            resValue 'string', 'invite_https_deep_link_pattern', nonReleaseInviteDeepLinkPattern
        }
        // local-smoke build. The Gradle name has no hyphen; build type names are identifiers.
        // Same invite contract as debug: empty HTTPS host, custom-scheme nav pattern, no App Link filter.
        localSmoke {
            initWith debug
            applicationIdSuffix '.localsmoke'
            matchingFallbacks = ['debug']
            buildConfigField 'String', 'INVITE_LINK_HTTPS_HOST', '""'
            manifestPlaceholders = [inviteLinkHttpsHost: '']
            resValue 'string', 'invite_https_deep_link_pattern', nonReleaseInviteDeepLinkPattern
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    sourceSets {
        getByName('release').manifest.srcFile(generatedReleaseManifest)
        getByName('androidTest').assets.srcDir("$projectDir/schemas")
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith('process') && task.name.contains('Manifest') && task.name.contains('Release')) {
        task.dependsOn(generateReleaseInviteManifest)
    }
}

tasks.matching { it.name == 'testDebugUnitTest' }.configureEach {
    dependsOn(
            'processReleaseManifest',
            'generateDebugResValues',
            'generateDebugAndroidTestResValues',
            'generateLocalSmokeResValues',
            'generateReleaseResValues')
}

gradle.taskGraph.whenReady { graph ->
    def releasePackagingRequested = graph.allTasks.any { task ->
        task.path in [':app:assembleRelease', ':app:packageRelease', ':app:bundleRelease', ':app:validateSigningRelease'] ||
            task.name in ['assembleRelease', 'packageRelease', 'bundleRelease', 'validateSigningRelease']
    }
    if (releasePackagingRequested && !skipSigning) {
        if (!hasReleaseSigning) {
            throw new GradleException(
                'Release build requested but signing configuration is missing. ' +
                'Provide signing credentials via environment variables ' +
                '(RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD), ' +
                'Gradle properties (-PreleaseStoreFile=..., -PreleaseStorePassword=..., -PreleaseKeyAlias=..., -PreleaseKeyPassword=...), ' +
                'or pass -PskipSigning for unsigned artifacts.'
            )
        }
        if (resolvedStoreFile == null || !resolvedStoreFile.isFile()) {
            throw new GradleException('Configured release keystore file does not exist.')
        }
    }
}

// Reports the Firebase configuration state per variant. Prints package names and
// booleans only — never API keys, app ids, or other values from google-services.json.
def generatedValuesByVariant = ['debug', 'release'].collectEntries { variant ->
    def capitalized = variant.capitalize()
    [variant, [
        file("build/generated/res/process${capitalized}GoogleServices/values/values.xml"),
        file("build/generated/res/google-services/${variant}/values/values.xml")
    ]]
}

tasks.register('checkFirebaseConfig') {
    group = 'verification'
    description = 'Reports whether google-services.json produced Firebase resources for each variant.'
    dependsOn tasks.matching { it.name ==~ /process(Debug|Release)GoogleServices/ }
    doLast {
        if (!googleServicesJsonPresent) {
            logger.lifecycle('Firebase configured: no')
            return
        }
        def json = new groovy.json.JsonSlurper().parse(googleServicesJsonFile)
        def clientPackages = json.client
            .collect { it.client_info?.android_client_info?.package_name }
            .findAll { it != null }
        def appIds = [:]
        ['debug', 'release'].each { variant ->
            def expectedPackage = variant == 'debug' ? 'com.nexachat.debug' : 'com.nexachat'
            def packageResolved = clientPackages.contains(expectedPackage)
            def generated = generatedValuesByVariant[variant].find { it.isFile() }
            def hasAppId = false
            def hasWebClientId = false
            if (generated != null) {
                def resources = new XmlSlurper().parse(generated)
                def appId = resources.string.find { it.@name == 'google_app_id' }
                hasAppId = appId != null && appId.text().trim() ? true : false
                appIds[variant] = hasAppId ? appId.text().trim() : null
                hasWebClientId = resources.string.any {
                    it.@name == 'default_web_client_id' && it.text().trim()
                }
            }
            logger.lifecycle("Firebase configured: ${packageResolved && hasAppId ? 'yes' : 'no'} " +
                "(variant=${variant}, client=${expectedPackage}, resolved=${packageResolved}, " +
                "google_app_id=${hasAppId}, default_web_client_id=${hasWebClientId})")
        }
        if (appIds.debug != null && appIds.release != null) {
            logger.lifecycle("Firebase debug and release app ids differ: ${appIds.debug != appIds.release}")
        }
    }
}

dependencies {
    constraints {
        // Media3 requests Guava 33.3.1-android. CVE-2026-102554 deserializes
        // attacker-controlled CompactHash* sizes; 33.7.2-android is the fix.
        implementation(libs.guava)
    }

    coreLibraryDesugaring(libs.desugar.jdk.libs)

    // Activity / Navigation / Lifecycle / Views
    implementation(libs.androidx.appcompat)
    implementation(libs.material)
    implementation(libs.androidx.constraintlayout)
    implementation(libs.androidx.recyclerview)
    implementation(libs.androidx.fragment)
    implementation(libs.androidx.navigation.fragment)
    implementation(libs.androidx.navigation.ui)
    implementation(libs.androidx.swiperefreshlayout)
    implementation(libs.bundles.lifecycle)

    // Hilt DI (Java annotationProcessor)
    implementation(libs.hilt.android)
    annotationProcessor(libs.hilt.android.compiler)

    // Room — local source of truth (offline-first, plan §12.2)
    implementation(libs.bundles.room)
    annotationProcessor(libs.androidx.room.compiler)

    // Network — Retrofit/REST + OkHttp (also used for the STOMP-over-WS client)
    implementation(libs.bundles.network)

    // Local storage — TokenStore / prefs (plan §12.1 core/storage)
    implementation(libs.androidx.datastore.preferences)
    implementation(libs.androidx.datastore.rxjava3)

    // Reactive streams (RxJava3)
    implementation(libs.rxjava)
    implementation(libs.rxandroid)

    // Image loading (avatars, media messages)
    implementation(libs.glide)
    annotationProcessor(libs.glide.compiler)

    // Media playback — voice/video messages
    implementation(libs.bundles.media3)

    // In-app audio calls
    implementation(libs.stream.webrtc)

    // E.164 phone normalization
    implementation(libs.libphonenumber)

    // WorkManager (Outbox sync worker)
    implementation(libs.androidx.work.runtime)
    implementation(libs.androidx.work.rxjava3)

    // Firebase Auth/RTDB are isolated to the optional ephemeral transport.
    implementation(platform(libs.firebase.bom))
    implementation(libs.firebase.auth)
    implementation(libs.firebase.database)

    // Firebase Cloud Messaging (Push notifications)
    implementation(libs.firebase.messaging)

    // Sign in with Google (Credential Manager; no Google Play Services needed at build time)
    implementation(libs.androidx.credentials)
    implementation(libs.androidx.credentials.play.services.auth)
    implementation(libs.googleid)

    // Unit tests
    testImplementation(libs.bundles.unit.test)
    testImplementation("com.squareup.okhttp3:mockwebserver:4.12.0")

    // Instrumented tests
    androidTestImplementation(libs.androidx.test.ext.junit)
    androidTestImplementation(libs.androidx.test.runner)
    androidTestImplementation(libs.androidx.room.testing)
    androidTestImplementation(libs.hilt.android.testing)
    androidTestAnnotationProcessor(libs.hilt.android.compiler)
}

tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
}
