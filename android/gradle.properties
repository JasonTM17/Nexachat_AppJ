# ---- Gradle daemon ----
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# JDK 17 toolchain location (local dev machine). Escaped Windows path;
# forward slashes also work. Override in local.properties/CI if needed.
org.gradle.java.home=C:\\Program Files\\Microsoft\\jdk-17.0.17.10-hotspot

# ---- Android ----
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---- Kotlin ----
kotlin.code.style=official
