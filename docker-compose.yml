services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexachat
      POSTGRES_USER: ${DATABASE_USER:?Set DATABASE_USER in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API + WebSocket server. Local-dev `up -d db` is unaffected; the app
  # container talks to Postgres over the compose network at db:5432 (the host
  # 5433 mapping is only for tools/ITs on the developer machine).
  app:
    image: nexachat-app:1.0.0
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://db:5432/nexachat}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      STORAGE_ROOT: ${STORAGE_ROOT:-/app/data/uploads}
      # Cloud LLM Tier (DeepSeek Cloud)
      NEXACHAT_SUMMARY_LLM_ENABLED: ${NEXACHAT_SUMMARY_LLM_ENABLED:-false}
      NEXACHAT_SUMMARY_LLM_BASE_URL: ${NEXACHAT_SUMMARY_LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      NEXACHAT_SUMMARY_LLM_MODEL: ${NEXACHAT_SUMMARY_LLM_MODEL:-gemini-3.1-flash-lite}
      NEXACHAT_SUMMARY_LLM_API_KEY: ${NEXACHAT_SUMMARY_LLM_API_KEY:-}
      # Local Server Model Tier (Ollama / vLLM / local server model)
      NEXACHAT_SUMMARY_LOCAL_LLM_ENABLED: ${NEXACHAT_SUMMARY_LOCAL_LLM_ENABLED:-false}
      NEXACHAT_SUMMARY_LOCAL_LLM_BASE_URL: ${NEXACHAT_SUMMARY_LOCAL_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      NEXACHAT_SUMMARY_LOCAL_LLM_MODEL: ${NEXACHAT_SUMMARY_LOCAL_LLM_MODEL:-qwen2.5:3b}
      NEXACHAT_SUMMARY_LOCAL_LLM_API_KEY: ${NEXACHAT_SUMMARY_LOCAL_LLM_API_KEY:-local-ollama}
      NEXACHAT_SUMMARY_LOCAL_LLM_TIMEOUT_MS: ${NEXACHAT_SUMMARY_LOCAL_LLM_TIMEOUT_MS:-60000}
      # Firebase Cloud Messaging (service account supplied through the host environment)
      FCM_ENABLED: ${FCM_ENABLED:-false}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - app-uploads:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

volumes:
  pgdata: {}
  app-uploads: {}
