services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexachat
      POSTGRES_USER: nexachat
      POSTGRES_PASSWORD: nexachat
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexachat -d nexachat"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: {}
