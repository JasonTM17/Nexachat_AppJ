# Isolated Round-4 ops stack (project nexachat_r4_ops, host ports 18092 / 15442).
name: nexachat_r4_ops

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexachat
      POSTGRES_USER: ${DATABASE_USER:?Set DATABASE_USER in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "15442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    image: nexachat-app:1.0.0
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod,json-logs
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://db:5432/nexachat}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      STORAGE_ROOT: ${STORAGE_ROOT:-/app/data/uploads}
      NEXACHAT_SUMMARY_LLM_ENABLED: ${NEXACHAT_SUMMARY_LLM_ENABLED:-false}
      NEXACHAT_SUMMARY_LLM_BASE_URL: ${NEXACHAT_SUMMARY_LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      NEXACHAT_SUMMARY_LLM_MODEL: ${NEXACHAT_SUMMARY_LLM_MODEL:-gemini-3.1-flash-lite}
      NEXACHAT_SUMMARY_LLM_API_KEY: ${NEXACHAT_SUMMARY_LLM_API_KEY:-}
      NEXACHAT_SUMMARY_LLM_FALLBACK_ENABLED: ${NEXACHAT_SUMMARY_LLM_FALLBACK_ENABLED:-false}
      NEXACHAT_SUMMARY_LLM_FALLBACK_BASE_URL: ${NEXACHAT_SUMMARY_LLM_FALLBACK_BASE_URL:-https://api.deepseek.com}
      NEXACHAT_SUMMARY_LLM_FALLBACK_MODEL: ${NEXACHAT_SUMMARY_LLM_FALLBACK_MODEL:-deepseek-flash}
      NEXACHAT_SUMMARY_LLM_FALLBACK_API_KEY: ${NEXACHAT_SUMMARY_LLM_FALLBACK_API_KEY:-}
      NEXACHAT_SUMMARY_LLM_FALLBACK_TIMEOUT_MS: ${NEXACHAT_SUMMARY_LLM_FALLBACK_TIMEOUT_MS:-30000}
      NEXACHAT_SUMMARY_LOCAL_LLM_ENABLED: ${NEXACHAT_SUMMARY_LOCAL_LLM_ENABLED:-false}
      NEXACHAT_SUMMARY_LOCAL_LLM_BASE_URL: ${NEXACHAT_SUMMARY_LOCAL_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      NEXACHAT_SUMMARY_LOCAL_LLM_MODEL: ${NEXACHAT_SUMMARY_LOCAL_LLM_MODEL:-qwen2.5:3b}
      NEXACHAT_SUMMARY_LOCAL_LLM_API_KEY: ${NEXACHAT_SUMMARY_LOCAL_LLM_API_KEY:-local-ollama}
      NEXACHAT_SUMMARY_LOCAL_LLM_TIMEOUT_MS: ${NEXACHAT_SUMMARY_LOCAL_LLM_TIMEOUT_MS:-60000}
      FCM_ENABLED: ${FCM_ENABLED:-false}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      NEXACHAT_RETENTION_ENABLED: ${NEXACHAT_RETENTION_ENABLED:-false}
      NEXACHAT_RETENTION_DRY_RUN: ${NEXACHAT_RETENTION_DRY_RUN:-true}
      NEXACHAT_RETENTION_BATCH_SIZE: ${NEXACHAT_RETENTION_BATCH_SIZE:-100}
      NEXACHAT_RETENTION_STATEMENT_TIMEOUT_MS: ${NEXACHAT_RETENTION_STATEMENT_TIMEOUT_MS:-2000}
      NEXACHAT_RETENTION_TRANSACTION_TIMEOUT_SECONDS: ${NEXACHAT_RETENTION_TRANSACTION_TIMEOUT_SECONDS:-15}
      NEXACHAT_RETENTION_INTERVAL_MS: ${NEXACHAT_RETENTION_INTERVAL_MS:-3600000}
      NEXACHAT_RETENTION_JOIN_REQUESTS_ENABLED: ${NEXACHAT_RETENTION_JOIN_REQUESTS_ENABLED:-false}
      NEXACHAT_RETENTION_JOIN_REQUESTS_RETENTION_DAYS: ${NEXACHAT_RETENTION_JOIN_REQUESTS_RETENTION_DAYS:-30}
      NEXACHAT_RETENTION_INVITE_BANS_ENABLED: ${NEXACHAT_RETENTION_INVITE_BANS_ENABLED:-false}
      NEXACHAT_RETENTION_INVITE_LINKS_ENABLED: ${NEXACHAT_RETENTION_INVITE_LINKS_ENABLED:-false}
      NEXACHAT_RETENTION_INVITE_LINKS_GRACE_DAYS: ${NEXACHAT_RETENTION_INVITE_LINKS_GRACE_DAYS:-30}
      NEXACHAT_RETENTION_IDEMPOTENCY_ENABLED: ${NEXACHAT_RETENTION_IDEMPOTENCY_ENABLED:-false}
      NEXACHAT_RETENTION_IDEMPOTENCY_TTL_HOURS: ${NEXACHAT_RETENTION_IDEMPOTENCY_TTL_HOURS:-24}
      NEXACHAT_RETENTION_REFRESH_TOKENS_ENABLED: ${NEXACHAT_RETENTION_REFRESH_TOKENS_ENABLED:-false}
      NEXACHAT_RETENTION_REFRESH_TOKENS_RETENTION_DAYS: ${NEXACHAT_RETENTION_REFRESH_TOKENS_RETENTION_DAYS:-30}
      NEXACHAT_RETENTION_DEVICE_TOKENS_ENABLED: ${NEXACHAT_RETENTION_DEVICE_TOKENS_ENABLED:-false}
      NEXACHAT_RETENTION_DEVICE_TOKENS_STALE_DAYS: ${NEXACHAT_RETENTION_DEVICE_TOKENS_STALE_DAYS:-180}
      NEXACHAT_RETENTION_REMINDERS_ENABLED: ${NEXACHAT_RETENTION_REMINDERS_ENABLED:-false}
      NEXACHAT_RETENTION_REMINDERS_RETENTION_DAYS: ${NEXACHAT_RETENTION_REMINDERS_RETENTION_DAYS:-30}
      NEXACHAT_RETENTION_POLLS_ENABLED: ${NEXACHAT_RETENTION_POLLS_ENABLED:-false}
      NEXACHAT_RETENTION_POLLS_RETENTION_DAYS: ${NEXACHAT_RETENTION_POLLS_RETENTION_DAYS:-365}
      NEXACHAT_RETENTION_CALL_RECORDS_ENABLED: ${NEXACHAT_RETENTION_CALL_RECORDS_ENABLED:-false}
      NEXACHAT_RETENTION_CALL_RECORDS_RETENTION_DAYS: ${NEXACHAT_RETENTION_CALL_RECORDS_RETENTION_DAYS:-365}
      NEXACHAT_RETENTION_ATTACHMENTS_ENABLED: ${NEXACHAT_RETENTION_ATTACHMENTS_ENABLED:-false}
      NEXACHAT_RETENTION_ATTACHMENTS_UNBOUND_HOURS: ${NEXACHAT_RETENTION_ATTACHMENTS_UNBOUND_HOURS:-24}
      NEXACHAT_RETENTION_ATTACHMENTS_DELETED_MESSAGE_DAYS: ${NEXACHAT_RETENTION_ATTACHMENTS_DELETED_MESSAGE_DAYS:-30}
      NEXACHAT_RETENTION_MESSAGE_TOMBSTONES_ENABLED: ${NEXACHAT_RETENTION_MESSAGE_TOMBSTONES_ENABLED:-false}
      NEXACHAT_RETENTION_MESSAGE_TOMBSTONES_RETENTION_DAYS: ${NEXACHAT_RETENTION_MESSAGE_TOMBSTONES_RETENTION_DAYS:-30}
      NEXACHAT_RETENTION_REACTION_EVENTS_ENABLED: ${NEXACHAT_RETENTION_REACTION_EVENTS_ENABLED:-false}
      NEXACHAT_RETENTION_SUMMARIES_ENABLED: ${NEXACHAT_RETENTION_SUMMARIES_ENABLED:-false}
      NEXACHAT_RETENTION_SUMMARY_LIMITS_ENABLED: ${NEXACHAT_RETENTION_SUMMARY_LIMITS_ENABLED:-false}
      NEXACHAT_RETENTION_SUMMARY_LIMITS_MINUTE_DAYS: ${NEXACHAT_RETENTION_SUMMARY_LIMITS_MINUTE_DAYS:-1}
      NEXACHAT_RETENTION_SUMMARY_LIMITS_DAY_DAYS: ${NEXACHAT_RETENTION_SUMMARY_LIMITS_DAY_DAYS:-2}
      NEXACHAT_RETENTION_RAG_CACHE_ENABLED: ${NEXACHAT_RETENTION_RAG_CACHE_ENABLED:-false}
      NEXACHAT_RETENTION_RAG_LIMITS_ENABLED: ${NEXACHAT_RETENTION_RAG_LIMITS_ENABLED:-false}
      NEXACHAT_RETENTION_RAG_LIMITS_MINUTE_DAYS: ${NEXACHAT_RETENTION_RAG_LIMITS_MINUTE_DAYS:-1}
      NEXACHAT_RETENTION_RAG_LIMITS_DAY_DAYS: ${NEXACHAT_RETENTION_RAG_LIMITS_DAY_DAYS:-2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "18092:8080"
    volumes:
      - app-uploads:/app/data
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  pgdata: {}
  app-uploads: {}
