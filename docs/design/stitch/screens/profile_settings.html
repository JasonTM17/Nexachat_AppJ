<!DOCTYPE html>

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    body {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col items-center justify-start selection:bg-primary selection:text-on-primary">
<!-- Mobile Viewport Container (~390px Width Container) -->
<div class="w-full max-w-[420px] min-h-screen bg-surface flex flex-col relative pb-24 shadow-sm">
<!-- TopAppBar Component (from Shared Components JSON) -->
<header class="bg-surface dark:bg-inverse-surface sticky top-0 z-50 flex items-center justify-between px-margin w-full h-14 shadow-sm dark:shadow-none">
<div class="flex items-center gap-space-sm">
<button aria-label="Quay lại" class="p-2 rounded-full hover:bg-surface-container dark:hover:bg-surface-container-high transition-colors duration-150 active:scale-95 transition-transform duration-100 flex items-center justify-center text-on-surface" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-headline-sm font-headline-sm font-bold tracking-tight text-on-surface dark:text-inverse-on-surface">Cài đặt</h1>
</div>
<div class="flex items-center gap-1">
<button aria-label="Tìm kiếm cài đặt" class="p-2 rounded-full hover:bg-surface-container dark:hover:bg-surface-container-high transition-colors duration-150 active:scale-95 transition-transform duration-100 flex items-center justify-center text-on-surface" type="button">
<span class="material-symbols-outlined text-[22px]" data-icon="search">search</span>
</button>
<button aria-label="Mã QR hồ sơ" class="p-2 rounded-full hover:bg-surface-container dark:hover:bg-surface-container-high transition-colors duration-150 active:scale-95 transition-transform duration-100 flex items-center justify-center text-primary" type="button">
<span class="material-symbols-outlined text-[22px]" data-icon="qr_code_2">qr_code_2</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin pt-space-sm flex flex-col gap-space-lg">
<!-- Profile Hero Bento Card -->
<section class="bg-surface-container-lowest rounded-xl p-space-lg shadow-[0_1px_3px_rgba(15,23,42,0.06)] border border-surface-container-highest/60 flex flex-col items-center text-center relative overflow-hidden">
<!-- Ambient Decorative Glow -->
<div class="absolute -top-12 -right-12 w-32 h-32 bg-primary-fixed rounded-full blur-2xl opacity-40 pointer-events-none"></div>
<div class="absolute -bottom-10 -left-10 w-28 h-28 bg-secondary-container rounded-full blur-2xl opacity-40 pointer-events-none"></div>
<!-- Avatar with Overlay Badge -->
<div class="relative mb-space-sm">
<div class="w-20 h-20 rounded-full bg-gradient-to-tr from-primary to-primary-container flex items-center justify-center text-on-primary font-headline-md text-headline-md tracking-tight shadow-md ring-4 ring-surface-container-lowest">
            NA
          </div>
<button aria-label="Cập nhật ảnh đại diện" class="absolute bottom-0 right-0 w-7 h-7 bg-primary hover:bg-primary-container text-on-primary rounded-full flex items-center justify-center shadow-sm active:scale-95 transition-transform duration-100 ring-2 ring-surface-container-lowest" type="button">
<span class="material-symbols-outlined text-[15px]" data-icon="photo_camera">photo_camera</span>
</button>
</div>
<!-- User Information -->
<div class="flex flex-col items-center w-full">
<div class="flex items-center gap-1.5">
<h2 class="text-title-md font-title-md font-bold text-on-surface">Nguyễn Văn An</h2>
<span class="material-symbols-outlined text-[18px] text-primary" data-icon="verified" data-weight="fill" style="font-variation-settings: 'FILL' 1;">verified</span>
</div>
<div class="inline-flex items-center gap-1.5 mt-1 px-2.5 py-0.5 rounded-full bg-surface-container-low text-on-surface-variant hover:bg-surface-container transition-colors cursor-pointer group">
<span class="material-symbols-outlined text-[14px] text-secondary" data-icon="call">call</span>
<span class="text-body-sm font-body-sm tracking-wide">0901234567</span>
<span class="material-symbols-outlined text-[14px] text-outline opacity-0 group-hover:opacity-100 transition-opacity" data-icon="content_copy">content_copy</span>
</div>
</div>
<!-- Action: Edit Profile Pill Button -->
<button class="mt-space-md inline-flex items-center justify-center gap-2 px-space-lg py-2 rounded-full bg-secondary-fixed text-on-secondary-fixed hover:bg-secondary-fixed-dim text-label-lg font-label-lg transition-colors duration-150 active:scale-95" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="edit">edit</span>
<span>Chỉnh sửa hồ sơ</span>
</button>
</section>
<!-- Section 1: Tài khoản -->
<section class="flex flex-col gap-1.5">
<h3 class="px-space-xs text-label-md font-label-md tracking-wider text-secondary">TÀI KHOẢN</h3>
<div class="bg-surface-container-lowest rounded-xl shadow-[0_1px_3px_rgba(15,23,42,0.06)] border border-surface-container-highest/60 divide-y divide-surface-container-high overflow-hidden">
<!-- Item: Đổi mật khẩu -->
<button class="w-full min-h-[56px] px-space-md py-3 flex items-center justify-between text-left hover:bg-surface-container-low transition-colors duration-150 active:bg-surface-container" type="button">
<div class="flex items-center gap-3.5">
<div class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[22px]" data-icon="lock">lock</span>
</div>
<div class="flex flex-col">
<span class="text-title-md font-title-md text-on-surface">Đổi mật khẩu</span>
<span class="text-body-sm font-body-sm text-on-surface-variant">Bảo mật tài khoản</span>
</div>
</div>
<span class="material-symbols-outlined text-[20px] text-outline-variant" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Item: Ngôn ngữ -->
<button class="w-full min-h-[56px] px-space-md py-3 flex items-center justify-between text-left hover:bg-surface-container-low transition-colors duration-150 active:bg-surface-container" type="button">
<div class="flex items-center gap-3.5">
<div class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[22px]" data-icon="language">language</span>
</div>
<span class="text-title-md font-title-md text-on-surface">Ngôn ngữ</span>
</div>
<div class="flex items-center gap-1.5">
<span class="text-label-lg font-label-lg text-secondary">Tiếng Việt</span>
<span class="material-symbols-outlined text-[20px] text-outline-variant" data-icon="chevron_right">chevron_right</span>
</div>
</button>
<!-- Item: Quyền riêng tư & Bảo mật -->
<button class="w-full min-h-[56px] px-space-md py-3 flex items-center justify-between text-left hover:bg-surface-container-low transition-colors duration-150 active:bg-surface-container" type="button">
<div class="flex items-center gap-3.5">
<div class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[22px]" data-icon="security">security</span>
</div>
<div class="flex flex-col">
<span class="text-title-md font-title-md text-on-surface">Quyền riêng tư &amp; Bảo mật</span>
<span class="text-body-sm font-body-sm text-on-surface-variant">Mã hóa đầu cuối, chặn số</span>
</div>
</div>
<span class="material-symbols-outlined text-[20px] text-outline-variant" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</section>
<!-- Section 2: Tùy chọn & Thông báo -->
<section class="flex flex-col gap-1.5">
<h3 class="px-space-xs text-label-md font-label-md tracking-wider text-secondary">TÙY CHỌN &amp; THÔNG BÁO</h3>
<div class="bg-surface-container-lowest rounded-xl shadow-[0_1px_3px_rgba(15,23,42,0.06)] border border-surface-container-highest/60 divide-y divide-surface-container-high overflow-hidden">
<!-- Item: Thông báo & Âm thanh -->
<button class="w-full min-h-[56px] px-space-md py-3 flex items-center justify-between text-left hover:bg-surface-container-low transition-colors duration-150 active:bg-surface-container" type="button">
<div class="flex items-center gap-3.5">
<div class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[22px]" data-icon="notifications">notifications</span>
</div>
<div class="flex flex-col">
<span class="text-title-md font-title-md text-on-surface">Thông báo &amp; Âm thanh</span>
<span class="text-body-sm font-body-sm text-on-surface-variant">Nhạc chuông, rung, pop-up</span>
</div>
</div>
<span class="material-symbols-outlined text-[20px] text-outline-variant" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Item: Giao diện & Chủ đề -->
<button class="w-full min-h-[56px] px-space-md py-3 flex items-center justify-between text-left hover:bg-surface-container-low transition-colors duration-150 active:bg-surface-container" type="button">
<div class="flex items-center gap-3.5">
<div class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[22px]" data-icon="palette">palette</span>
</div>
<span class="text-title-md font-title-md text-on-surface">Giao diện &amp; Chủ đề</span>
</div>
<div class="flex items-center gap-1.5">
<span class="px-2 py-0.5 rounded bg-surface-container-high text-on-surface text-label-sm font-label-sm">Sáng</span>
<span class="material-symbols-outlined text-[20px] text-outline-variant" data-icon="chevron_right">chevron_right</span>
</div>
</button>
</div>
</section>
<!-- Section 3: Phiên đăng nhập -->
<section class="flex flex-col gap-1.5">
<h3 class="px-space-xs text-label-md font-label-md tracking-wider text-secondary">PHIÊN ĐĂNG NHẬP</h3>
<div class="bg-surface-container-lowest rounded-xl shadow-[0_1px_3px_rgba(15,23,42,0.06)] border border-surface-container-highest/60 overflow-hidden">
<!-- Item: Đăng xuất -->
<button class="w-full min-h-[56px] px-space-md py-3.5 flex items-center justify-between text-left hover:bg-error-container/30 transition-colors duration-150 active:scale-[0.99]" type="button">
<div class="flex items-center gap-3.5">
<div class="w-10 h-10 rounded-lg bg-error-container/60 flex items-center justify-center text-error">
<span class="material-symbols-outlined text-[22px]" data-icon="logout">logout</span>
</div>
<span class="text-title-md font-title-md text-error">Đăng xuất</span>
</div>
<span class="material-symbols-outlined text-[20px] text-error/60" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</section>
<!-- App Version & Security Trust Badge -->
<footer class="mt-space-sm mb-4 flex flex-col items-center justify-center text-center gap-1">
<div class="flex items-center gap-1.5 text-on-surface-variant/80">
<span class="material-symbols-outlined text-[14px]" data-icon="lock">lock</span>
<span class="text-label-sm font-label-sm tracking-wide">Mã hóa đầu cuối</span>
</div>
<p class="text-body-sm font-body-sm text-outline">NexaChat v2.4.0 (Build 1206)</p>
</footer>
</main>
<!-- BottomNavBar Component (from Shared Components JSON) -->
<!-- Active Destination Determined Autonomously: "Cài đặt" (Settings) matches current screen intent -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-16 px-space-xs pb-safe bg-surface-container-lowest dark:bg-inverse-surface shadow-[0_-1px_3px_rgba(15,23,42,0.06)] dark:shadow-none max-w-[420px] left-1/2 -translate-x-1/2">
<!-- Tab 1: Đoạn chat (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container dark:hover:bg-surface-container-high transition-colors duration-150 active:scale-95 transition-transform duration-100" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="chat">chat</span>
<span class="text-label-sm font-label-sm mt-0.5">Đoạn chat</span>
</button>
<!-- Tab 2: Cuộc gọi (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container dark:hover:bg-surface-container-high transition-colors duration-150 active:scale-95 transition-transform duration-100" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="call">call</span>
<span class="text-label-sm font-label-sm mt-0.5">Cuộc gọi</span>
</button>
<!-- Tab 3: Danh bạ (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container dark:hover:bg-surface-container-high transition-colors duration-150 active:scale-95 transition-transform duration-100" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="contacts">contacts</span>
<span class="text-label-sm font-label-sm mt-0.5">Danh bạ</span>
</button>
<!-- Tab 4: Cài đặt (Active - Style instructions executed from JSON) -->
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-primary-container text-on-secondary-container dark:text-on-primary-container rounded-full px-4 py-1 hover:bg-surface-container dark:hover:bg-surface-container-high transition-colors duration-150 active:scale-95 transition-transform duration-100" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="settings" data-weight="fill" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="text-label-sm font-label-sm mt-0.5">Cài đặt</span>
</button>
</nav>
</div>
</body></html>
