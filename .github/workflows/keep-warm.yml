# Keeps the Render Free instance warm so users never pay the ~15-minute idle
# spin-down / cold-start tax documented in application-render.yml.
# Pings liveness (cheap, no DB) every 10 minutes — well under Render's
# 15-minute idle window. Failures are reported but never block other work.
name: prod-keep-warm

on:
  schedule:
    # Render Free idles out after ~15 min without traffic.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - name: Ping liveness
        run: |
          code=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 20 \
            https://nexachat-api-rl1v.onrender.com/actuator/health/liveness || echo "000")
          echo "liveness=$code"
          test "$code" = "200"
      - name: Alert on cold prod
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Dedup: don't open a new issue every 10 min while prod stays down.
          open=$(gh issue list --state open --search "prod liveness failing (keep-warm) in:title" --limit 1 --json number -q 'length')
          if [ "$open" = "0" ]; then
            gh issue create \
              --title "prod liveness failing (keep-warm)" \
              --body "Ping returned non-200 in ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Render Free may be cold, crashed, or Render may be down."
          fi
