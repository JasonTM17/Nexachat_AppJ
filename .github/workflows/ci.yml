name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep in-flight main builds; PR pushes may supersede older runs on the same ref.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  server-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexachat
          POSTGRES_USER: nexachat
          POSTGRES_PASSWORD: nexachat-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexachat -d nexachat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # Full commit SHA pins are paired with the upstream release tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven verify
        working-directory: server
        run: mvn -B verify
        env:
          # Integration tests use this job-local Postgres service on :5432.
          IT_DB_URL: jdbc:postgresql://localhost:5432/nexachat
          IT_DB_USER: nexachat
          IT_DB_PASSWORD: nexachat-ci-password
      - name: Upload server test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-test-reports
          path: |
            server/target/surefire-reports/**
            server/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 7

  android-test:
    runs-on: ubuntu-latest
    steps:
      # Full commit SHA pins are paired with the upstream release tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
            android/build.gradle
            android/app/build.gradle
      - name: Android tests, lint and debug assembly
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - name: Upload Android test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-reports
          path: |
            android/app/build/test-results/**
            android/app/build/reports/lint-results*.html
          if-no-files-found: ignore
          retention-days: 7

  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      # Full commit SHA pins are paired with the upstream release tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Markdown links
        run: python tools/check-markdown-links.py
      - name: Check static site
        run: python site/check.py
      - name: Check Android string resources
        run: |
          python tools/check-android-strings.py --self-test
          python tools/check-android-strings.py
      - name: Validate GitHub Actions workflows
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- 1.7.7
          ./actionlint .github/workflows/*.yml
      - name: Check shell syntax and style
        shell: bash
        run: |
          mapfile -t scripts < <(find demo tools -name '*.sh' -type f | sort)
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck "${scripts[@]}"
          else
            echo "::notice::shellcheck not on runner; skipped style checks (bash -n passed)."
          fi

  firebase-rules:
    # Offline Firebase RTDB rules contract. Uses the demo project and the local
    # emulator only; no repository secret or cloud credential is required.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full commit SHA pins are paired with the upstream release tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/firebase-rules/package-lock.json
      - name: Cache the pinned database emulator
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('tools/firebase-rules/package-lock.json') }}
          restore-keys: |
            firebase-emulators-${{ runner.os }}-
      - name: Install pinned test dependencies
        working-directory: tools/firebase-rules
        run: npm ci
      - name: Run the rules contract matrix
        working-directory: tools/firebase-rules
        run: npm test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # Full commit SHA pins are paired with the upstream release tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Block committed secrets without echoing matched values
        shell: bash
        run: |
          if matches="$(grep -rIlE 'BEGIN.*PRIVATE KEY|api[_-]?key.*=.*[A-Za-z0-9]{20,}|VERCEL_TOKEN=[A-Za-z0-9]{20,}|FCM_SERVICE_ACCOUNT_JSON=\{' \
              --include='*.java' --include='*.gradle' --include='*.yml' \
              --include='*.json' --include='*.sh' --include='*.py' \
              --exclude='ci.yml' --exclude='assetlinks.json' --exclude='google-services.json' \
              --exclude='.env.example' --exclude-dir='.git' --exclude-dir='node_modules' .)"; then
            echo "::error::Possible committed secret pattern found in these files (values omitted):"
            printf '%s\n' "$matches"
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "::error::Secret scan could not complete (grep status $status)."
              exit "$status"
            fi
            echo "No secret patterns found"
          fi

  publish-container:
    # Publishes the server image to GitHub Packages (ghcr.io) after all gates pass on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [server-test, android-test, repo-hygiene, firebase-rules, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and push to ghcr.io
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')/nexachat-server"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker build -f server/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$REPO" \
            --label "org.opencontainers.image.revision=$SHA" \
            -t "$IMAGE:latest" -t "$IMAGE:sha-${SHA::7}" server
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-${SHA::7}"
