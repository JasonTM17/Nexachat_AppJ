name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  server-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexachat
          POSTGRES_USER: nexachat
          POSTGRES_PASSWORD: nexachat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexachat -d nexachat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven verify
        working-directory: server
        run: mvn -B verify
        env:
          # Integration tests (*IT, failsafe) target the postgres service on :5432;
          # locally they default to the compose DB on :5433.
          IT_DB_URL: jdbc:postgresql://localhost:5432/nexachat
          IT_DB_USER: nexachat
          IT_DB_PASSWORD: nexachat

  android-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # The Gradle wrapper (gradlew + gradle-wrapper.jar) is committed.
      - name: Android unit tests
        run: |
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace
      - name: Android lint
        run: |
          cd android
          ./gradlew lintDebug --stacktrace

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block committed secrets
        run: |
          # grep exit 0 = match found -> fail; exit 1 = clean -> pass.
          # ci.yml is excluded so this pattern cannot match itself.
          if grep -rE 'BEGIN.*PRIVATE KEY|api[_-]?key.*=.*[A-Za-z0-9]{20,}' \
              --include='*.kt' --include='*.java' --include='*.yml' \
              --exclude='ci.yml' --exclude-dir='.git' . ; then
            echo "::error::Possible committed secret — see matches above"
            exit 1
          else
            echo "No secret patterns found"
            exit 0
          fi
