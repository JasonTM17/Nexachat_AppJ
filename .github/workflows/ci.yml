name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexachat
          POSTGRES_USER: nexachat
          POSTGRES_PASSWORD: nexachat-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexachat -d nexachat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # Full commit SHA pins are paired with the upstream release tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven verify
        working-directory: server
        run: mvn -B verify
        env:
          # Integration tests use this job-local Postgres service on :5432.
          IT_DB_URL: jdbc:postgresql://localhost:5432/nexachat
          IT_DB_USER: nexachat
          IT_DB_PASSWORD: nexachat-ci-password
      - name: Upload server test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-test-reports
          path: |
            server/target/surefire-reports/**
            server/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 7

  android-test:
    runs-on: ubuntu-latest
    steps:
      # Full commit SHA pins are paired with the upstream release tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
            android/build.gradle
            android/app/build.gradle
      - name: Android tests, lint and debug assembly
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - name: Upload Android test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-reports
          path: |
            android/app/build/test-results/**
            android/app/build/reports/lint-results*.html
          if-no-files-found: ignore
          retention-days: 7

  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      # Full commit SHA pins are paired with the upstream release tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Markdown links
        run: python tools/check-markdown-links.py
      - name: Check shell syntax and style when available
        shell: bash
        run: |
          bash -n demo/*.sh tools/*.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck demo/*.sh tools/*.sh
          else
            echo "::notice::shellcheck is not installed on this runner; bash -n passed."
          fi

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # Full commit SHA pins are paired with the upstream release tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Block committed secrets without echoing matched values
        shell: bash
        run: |
          if matches="$(grep -rIlE 'BEGIN.*PRIVATE KEY|api[_-]?key.*=.*[A-Za-z0-9]{20,}' \
              --include='*.java' --include='*.gradle' --include='*.yml' \
              --exclude='ci.yml' --exclude-dir='.git' .)"; then
            echo "::error::Possible committed secret pattern found in these files (values omitted):"
            printf '%s\n' "$matches"
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "::error::Secret scan could not complete (grep status $status)."
              exit "$status"
            fi
            echo "No secret patterns found"
          fi

  publish-container:
    # Publishes the server image to GitHub Packages (ghcr.io) after all gates pass on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [server-test, android-test, repo-hygiene, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and push to ghcr.io
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')/nexachat-server"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker build -f server/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$REPO" \
            --label "org.opencontainers.image.revision=$SHA" \
            -t "$IMAGE:latest" -t "$IMAGE:sha-${SHA::7}" server
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-${SHA::7}"
