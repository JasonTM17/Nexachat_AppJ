# Example Prometheus alert rules for the NexaChat server.
#
# These are starting points, not a finished monitoring policy. Adjust the
# thresholds to the deployment's traffic and scrape interval. Apply with:
#   promtool check rules prometheus-alerts.yml
# and load through your Prometheus rule_files entry.
groups:
  - name: nexachat-errors
    rules:
      - alert: NexaChatHighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{outcome="SERVER_ERROR"}[5m]))
            / sum(rate(http_server_requests_seconds_count[5m])) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: NexaChat 5xx rate is above 1%
          description: "The 5xx share of HTTP requests has been above 1% for 5 minutes."

  - name: nexachat-performance
    rules:
      - alert: NexaChatDeltaSyncSlow
        expr: |
          histogram_quantile(0.95,
            sum(rate(nexachat_delta_sync_duration_seconds_bucket[5m])) by (le)) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Delta-sync p95 latency is above 2 seconds
          description: "p95 of nexachat_delta_sync_duration has been above 2s for 10 minutes."

  - name: nexachat-dependencies
    rules:
      - alert: NexaChatPushFailures
        expr: |
          sum(rate(nexachat_push_sends_total{result!="SUCCESS"}[15m]))
            / sum(rate(nexachat_push_sends_total[15m])) > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Push failure rate is above 5%
          description: "More than 5% of push sends have failed for 15 minutes."

      - alert: NexaChatLlmFallbackHigh
        expr: |
          sum(rate(nexachat_llm_duration_seconds_count{outcome="FAILURE"}[15m]))
            / sum(rate(nexachat_llm_duration_seconds_count[15m])) > 0.20
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: LLM fallback rate is above 20%
          description: "More than 20% of LLM calls have failed or fallen back for 15 minutes."

      - alert: NexaChatDatabaseSlow
        expr: |
          sum(rate(nexachat_repository_calls_seconds_sum{outcome="SUCCESS"}[5m])) by (method)
            / sum(rate(nexachat_repository_calls_seconds_count{outcome="SUCCESS"}[5m])) by (method) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Repository average latency is above 500 ms
          description: "Average repository call latency has been above 500ms for 10 minutes."

  - name: nexachat-storage
    rules:
      - alert: NexaChatStorageFailureRate
        expr: |
          sum(rate(nexachat_storage_operations_total{outcome="FAILURE"}[15m]))
            / sum(rate(nexachat_storage_operations_total[15m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Storage operation failure rate is above 5%
          description: "More than 5% of store, open or delete operations failed for 10 minutes."

      - alert: NexaChatStorageOperationSlow
        expr: |
          histogram_quantile(0.95,
            sum(rate(nexachat_storage_operation_duration_seconds_bucket[10m])) by (le, operation, provider)) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Storage operation p95 latency is above 5 seconds
          description: "p95 request-level storage latency has been above 5s for 10 minutes."

      - alert: NexaChatStorageStreamSlow
        expr: |
          histogram_quantile(0.95,
            sum(rate(nexachat_storage_stream_duration_seconds_bucket[10m])) by (le, operation, provider)) > 60
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Storage stream consumption p95 is above 60 seconds
          description: "p95 stream consumption has been above 60s for 10 minutes; check for stalled clients or slow object storage."
